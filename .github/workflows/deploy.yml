name: Fast Laravel Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build Frontend Assets
        run: |
          npm install
          npm run build

      - name: Create Deployment Archive
        run: |
          # Compress everything into a single zip file, excluding git, node_modules, and local env
          zip -r deployment.zip . -x "*.git*" -x "node_modules/*" -x ".env"

      - name: Upload Single Zip via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          include: |
            deployment.zip
          server-dir: public_html/artlab/

      - name: Unzip and Optimize on Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          script: |
            cd public_html/artlab
            unzip -o deployment.zip
            rm deployment.zip
            php artisan config:cache
            php artisan route:cache
